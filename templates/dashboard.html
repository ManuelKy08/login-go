<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSP Makmur Mandiri - Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --primary-color: #4f46e5;
            --secondary-color: #6366f1;
            --accent-color: #10b981;
            --muted-color: #6b7280;
            --border-color: #e5e7eb;
            --card-bg: #ffffff;
            --stat-color: #10b981;
        }
        
        [data-theme="dark"] {
            --bg-color: #111827;
            --text-color: #f9fafb;
            --primary-color: #a5f3fc;
            --secondary-color: #818cf8;
            --accent-color: #34d399;
            --muted-color: #9ca3af;
            --border-color: #374151;
            --card-bg: #1f2937;
            --stat-color: #34d399;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 2rem;
        }
        
        a { text-decoration: none; color: inherit; }
        
        .dashboard-page { max-width: 600px; margin: 0 auto; }
        
        .dashboard-header { margin-bottom: 2rem; }
        
        .header-info h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 4px; }
        .header-info p { color: var(--muted-color); font-size: 0.875rem; }
        
        .logout-link { align-self: flex-end; }
        
        .stat-card { background: var(--card-bg); padding: 1.5rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center; margin-top: 2rem; }
        [data-theme="dark"] .stat-card { box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        
        .stat-value { font-size: 2rem; font-weight: 700; color: var(--stat-color); }
        .stat-label { color: var(--muted-color); font-size: 0.875rem; margin-top: 4px; }
        
        .logout-link a { color: var(--muted-color); font-size: 0.875rem; }
    </style>
</head>
<body>
    <div class="dashboard-page">
        <div class="dashboard-header">
            <div class="header-info">
                <h1>Selamat datang,</h1>
                <h2>{{ .FullName }}</h2>
                <p style="color: var(--muted-color);">Member Aktif</p>
            </div>
            <div>
                <a href="/logout" class="logout-link">Logout</a>
            </div>
        </div>
        
        <div class="stat-grid">
            <div class="stat-card">
                <div class="stat-value">Rp 0</div>
                <div class="stat-label">Total Simpanan</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-value">Rp 0</div>
                <div class="stat-label">Pinjaman Aktif</div>
            </div>
        </div>
    </div>
</body>
</html>
