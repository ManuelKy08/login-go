<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSP Makmur Mandiri - Daftar</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --primary-color: #4f46e5;
            --secondary-color: #6366f1;
            --accent-color: #10b981;
            --muted-color: #6b7280;
            --border-color: #e5e7eb;
            --card-bg: #ffffff;
        }
        
        [data-theme="dark"] {
            --bg-color: #111827;
            --text-color: #f9fafb;
            --primary-color: #a5f3fc;
            --secondary-color: #818cf8;
            --accent-color: #34d399;
            --muted-color: #9ca3af;
            --border-color: #374151;
            --card-bg: #1f2937;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        a { text-decoration: none; color: inherit; transition: color 0.2s ease; }
        
        .container { max-width: 420px; width: 100%; }
        
        .card { background: var(--card-bg); border-radius: 12px; padding: 40px 32px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.08); transition: box-shadow 0.3s ease; }
        [data-theme="dark"] .card { box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        
        .brand { width: 40px; height: 40px; margin: 0 auto 24px; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .brand span { width: 28px; height: 28px; background: white; border-radius: 6px; font-weight: 700; font-size: 1.2rem; color: var(--bg-color); }
        
        .title { font-size: 1.75rem; font-weight: 600; text-align: center; margin-bottom: 8px; }
        .subtitle { color: var(--muted-color); font-size: 0.875rem; text-align: center; margin-bottom: 24px; }
        
        .divider { height: 1px; background-color: var(--border-color); margin: 24px 0; }
        
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 8px; }
        .form-input { width: 100%; padding: 12px 16px; font-family: 'Inter', sans-serif; font-size: 1rem; color: var(--text-color); background: white; border: 2px solid var(--border-color); border-radius: 8px; transition: border-color 0.2s ease, box-shadow 0.2s ease; }
        .form-input:focus { outline: none; border-color: var(--secondary-color); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); }
        .form-input::placeholder { color: var(--muted-color); }
        
        .password-group { position: relative; }
        .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted-color); cursor: pointer; font-size: 0.875rem; }
        
        .btn { width: 100%; padding: 12px 24px; border-radius: 8px; font-weight: 500; font-size: 1rem; cursor: pointer; border: none; transition: all 0.2s ease; }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: var(--secondary-color); transform: translateY(-2px); }
        .btn-secondary { background: transparent; color: var(--primary-color); padding: 10px 20px; border: 2px solid var(--primary-color); margin-top: 8px; }
        .btn-secondary:hover { background: var(--primary-color); color: white; }
        
        .alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 0.875rem; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .alert-success { background: #d1fae5; color: #059669; border: 1px solid #a3e635; }
        
        .password-requirements { margin-top: 8px; font-size: 0.75rem; color: var(--muted-color); }
        .password-requirements strong { color: var(--primary-color); }
        
        .footer-text { margin-top: 24px; text-align: center; font-size: 0.75rem; color: var(--muted-color); }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <span>KSP</span>
        </div>
        <h1 class="title">Daftar Akun</h1>
        <p class="subtitle">Buat akun gratis untuk mengakses fitur KSP Makmur Mandiri</p>
        
        {{ if .Error }}
        <div class="alert alert-error">{{ .Error }}</div>
        {{ end }}
        
        <form action="/register" method="POST" class="p-6">
            <div class="form-group">
                <label class="form-label" for="name">Nama Lengkap</label>
                <input class="form-input" type="text" id="name" name="name" placeholder="Nama lengkap Anda" autocomplete="name" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input class="form-input" type="email" id="email" name="email" placeholder="Masukkan email Anda" autocomplete="email" required>
            </div>
            
            <div class="form-group password-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-input" type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="new-password" required>
                <span class="toggle-password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted-color); cursor: pointer; font-size: 0.875rem;">👁</span>
                <div class="password-requirements">
                    <strong>Password requirements</strong>
                    <ul>
                        <li>✓ Minimal 8 karakter</li>
                        <li>○ Mengandung huruf besar</li>
                        <li>○ Mengandung angka</li>
                    </ul>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="confirm_password">Konfirmasi Password</label>
                <div class="position-relative">
                    <input class="form-input" type="password" id="confirm_password" name="confirm_password" placeholder="Konfirmasi password" autocomplete="new-password" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary w-full mb-4">Daftar</button>
            
            <div class="text-center">
                <span>Sudah punya akun? <a href="/login" class="btn btn-secondary">Masuk</a></span>
            </div>
        </form>
    </div>
    
    <script>
        document.querySelectorAll('.toggle-password').forEach(function(eye) {
            eye.addEventListener('click', function() {
                const input = this.previousElementSibling;
                if (input.type === 'password') {
                    input.type = 'text';
                    this.textContent = '🙈';
                } else {
                    input.type = 'password';
                    this.textContent = '👁';
                }
            });
        });
    </script>
</body>
</html>
